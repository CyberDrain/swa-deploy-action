---
# Typical Node app. The action detects the package manager, matches the Node version the
# project asks for, and builds with the runner's toolchain - no container, no Oryx.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v7

      # No setup-node needed. The action reads engines.node (or .nvmrc), and if the
      # runner's Node does not satisfy it, resolves the range against nodejs.org and
      # installs a matching release - so the version never goes stale.
      - uses: CyberDrain/swa-deploy-action@v1
        id: deploy
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/"
          output_location: "dist"
          production_branch: "main"

      - run: echo "Deployed to ${{ steps.deploy.outputs.static_web_app_url }}"

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      # Preview teardown is the one job this action does not implement
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
